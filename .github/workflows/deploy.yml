name: Despliegue Terragrunt S3 Multi-Environment

on:
  push:
    branches:
      - main        # dispara despliegue a prod
      - develop     # dispara despliegue a dev
      - release/**  # dispara despliegue a qa
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno a desplegar manualmente'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  id-token: write   # requerido para autenticación OIDC con AWS
  contents: read

jobs:
  # ─── Determinar el entorno según la rama ───────────────────────────────────
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: 🌍 Determinar entorno
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          else
            echo "environment=qa" >> "$GITHUB_OUTPUT"
          fi

  # ─── Despliegue con Terragrunt ─────────────────────────────────────────────
  deploy:
    needs: set-environment
    name: Terragrunt Apply (${{ needs.set-environment.outputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.environment }}

    defaults:
      run:
        working-directory: ./environments/${{ needs.set-environment.outputs.environment }}

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🔍 Debug OIDC Token Claims
        run: |
          # Extraemos el JWT token que GitHub Actions emite
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          # Decodificamos el payload para ver el claim "sub" exacto que AWS está evaluando
          PAYLOAD=$(echo "$TOKEN" | awk -F. '{print $2}' | sed 's/-/+/g; s/_/\//g')
          # Añadimos padding si es necesario
          MOD=$((${#PAYLOAD} % 4))
          if [ $MOD -eq 2 ]; then PAYLOAD="${PAYLOAD}=="; elif [ $MOD -eq 3 ]; then PAYLOAD="${PAYLOAD}="; fi
          echo "El claim que GitHub está enviando a AWS es:"
          echo "$PAYLOAD" | base64 -d | jq '{sub: .sub, aud: .aud, repository: .repository, environment: .environment}'

      - name: ☁️ Configurar credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 🏗️ Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: 🚜 Instalar Terragrunt
        run: |
          TERRAGRUNT_VERSION="v1.1.5"
          curl -L -o terragrunt \
            https://github.com/gruntwork-io/terragrunt/releases/download/${TERRAGRUNT_VERSION}/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: 📝 Terragrunt Init
        run: terragrunt init

      - name: 🔍 Terragrunt Plan
        run: terragrunt plan -out=tfplan

      - name: 🚀 Terragrunt Apply
        run: terragrunt apply -auto-approve tfplan
